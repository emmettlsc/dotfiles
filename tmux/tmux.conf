# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Emacs-style key bindings
set-window-option -g mode-keys emacs
set-option -g status-keys emacs

# Split panes with | and -, inheriting current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# True color and 256 color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar styling
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 30
set -g status-left "#[fg=#88c0d0,bold] #S "
set -g status-right "#[fg=#a3be8c]%Y-%m-%d #[fg=#88c0d0]%H:%M "
set -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0,bold] #I:#W "
set -g window-status-format " #[fg=#81a1c1]#I:#W "
set -g status-justify left

# Pane borders
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

# Message styling
set -g message-style "bg=#3b4252,fg=#d8dee9"

# Window numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
